name: CI
on: push
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/services/api/go.mod
          cache-dependency-path: apps/services/api/go.sum
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx affected -t lint typecheck test build
